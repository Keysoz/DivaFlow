name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diva-spec-v5-3-final/diva-spec
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - run: make test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diva-spec-v5-3-final/diva-spec
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: make audit

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: make -C diva-spec-v5-3-final/diva-spec secret-scan
