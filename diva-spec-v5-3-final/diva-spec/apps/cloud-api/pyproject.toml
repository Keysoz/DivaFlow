[project]
name = "cloud-api"
version = "0.1.0"
description = "Diva cloud API: chat, AI, orders, Control Room API, Telegram bot, workers."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_api"]
