[project]
name = "cloud-api"
version = "0.1.0"
description = "Diva cloud API: chat, AI, orders, Control Room API, Telegram bot, workers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=44",
  "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_api"]
