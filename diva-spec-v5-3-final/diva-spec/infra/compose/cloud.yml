name: diva-cloud

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diva
      POSTGRES_USER: diva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diva -d diva"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../apps/cloud-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/compose/.env}
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in infra/compose/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/compose/.env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in infra/compose/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-[]}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN in infra/compose/.env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
