name: diva-cloud

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diva
      POSTGRES_USER: diva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diva -d diva"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../apps/cloud-api
    environment:
      DATABASE_URL: postgresql+psycopg://diva:${POSTGRES_PASSWORD}@db:5432/diva
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
