    property: hidden
    value: 1

workspaces:
  # E-02: hide HR, payroll and manufacturing workspaces (DEC-24).
  # HR and Payroll are currently absent on the dev site and are reported as "missing".
  - name: HR
    hidden: true
  - name: Payroll
    hidden: true
  - name: Manufacturing
    hidden: true
  # ENH-E-02: keep the Desk focused on the shop; these modules are unused.
  - name: Assets
    hidden: true
  - name: Quality
    hidden: true
  - name: Projects
    hidden: true
  - name: Support
    hidden: true
  - name: Website
    hidden: true
  - name: CRM
    hidden: true
  - name: Build
    hidden: true

singles:
  # Global defaults: the company is required by reports opened from dashboards
  # without explicit filters (e.g. Item-wise Sales History).
  - doctype: Global Defaults
    field: default_company
    value: Diva Dev
  # DEC-90: the system currency must match the company currency, otherwise
  # ERPNext tries an INR -> EGP exchange rate lookup on every document.
  - doctype: Global Defaults
    field: default_currency
    value: EGP
  # E-04: negative stock off; reservations on (RULE-STOCK / DEC-08).
  - doctype: Stock Settings
    field: allow_negative_stock
    value: 0
  - doctype: Stock Settings
    field: enable_stock_reservation
    value: 1
  - doctype: Stock Settings
    field: auto_reserve_stock
    value: 1
  # E-14c: FEFO for batch items and auto bundles at the counter.
  - doctype: Stock Settings
    field: pick_serial_and_batch_based_on
    value: Expiry
  - doctype: Stock Settings
    field: enable_serial_and_batch_no_for_item
    value: 1
  - doctype: Stock Settings
    field: auto_create_serial_and_batch_bundle_for_outward
    value: 1

# DEC-78: one governed custom field so the Item quick entry can take a barcode.
# diva_guard copies it into the Item Barcode child table on save.
custom_fields:
  - dt: Item
    fieldname: custom_barcode
    label: Barcode
    fieldtype: Data
    insert_after: item_name
    allow_in_quick_entry: 1
    no_copy: 1
    description: "Scan or type a barcode; leave blank to auto-generate an internal EAN-13 (starts with 20)."

# E-16 / DEC-72: POS Next ships Custom DocPerm rows. Frappe ignores the
# standard DocPerm table for any doctype that has custom rows, so roles without
# a custom row lose access. Mirror the standard rows back (existing custom rows,
# including the vendor's POSNext Cashier, are left untouched).
permission_mirrors:
  - Account
  - Address
  - Bin
  - Customer
  - Item
  - Journal Entry
  - POS Closing Entry
  - POS Opening Entry
  - POS Profile
  - Payment Entry
  - Promotional Scheme
  - Sales Invoice
  - Serial and Batch Bundle
  - Territory
  - Warehouse

# E-15: bilingual (Arabic primary, English second line) print formats. The HTML
# templates live in infra/erpnext-config/print_formats and are applied as data.
print_formats:
  - name: Diva Sales Invoice A4
    doc_type: Sales Invoice
    template: print_formats/diva_sales_invoice_a4.html
  - name: Diva Receipt 80mm
    doc_type: Sales Invoice
    template: print_formats/diva_receipt_80mm.html
  - name: Diva Payment Receipt
    doc_type: Payment Entry
    template: print_formats/diva_payment_receipt.html
  - name: Diva Purchase Invoice A4
    doc_type: Purchase Invoice
    template: print_formats/diva_purchase_invoice_a4.html
  - name: Diva Purchase Receipt A4
    doc_type: Purchase Receipt
    template: print_formats/diva_purchase_receipt_a4.html
  - name: Diva Journal Entry A4
    doc_type: Journal Entry
    template: print_formats/diva_journal_entry_a4.html
  - name: Diva Customer Statement
    doc_type: Customer
    template: print_formats/diva_customer_statement.html
  - name: Diva Supplier Statement
    doc_type: Supplier
    template: print_formats/diva_supplier_statement.html

records:
  # E-04: the Dozen UOM is a whole number (DEC-20); item group tree default (OPEN-13).
  - doctype: UOM
    match: { uom_name: Dozen }
    set: { must_be_whole_number: 1, enabled: 1 }
  - doctype: Item Group
    match: { item_group_name: Accessories }
    set: { is_group: 0, parent_item_group: All Item Groups }
  - doctype: Item Group
    match: { item_group_name: Cosmetics }
    set: { is_group: 0, parent_item_group: All Item Groups }
  # E-05: one extra selling tier (OPEN-03 default: standard plus one tier).
  - doctype: Price List
    match: { price_list_name: Wholesale }
    set: { selling: 1, currency: EGP, enabled: 1 }
  # Arabic for the one new quick-entry label/description (DEC-79).
  - doctype: Translation
    match: { language: ar, source_text: "Selling Price (EGP/Dozen)" }
    set: { translated_text: "سعر البيع (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Saved to the Standard Selling price list per Dozen when the item is saved." }
    set: { translated_text: "يُحفظ في قائمة أسعار البيع القياسية لكل دستة عند حفظ الصنف." }

  # DEC-85/DEC-87: Arabic for the new Desk strings. Native review is requested in the pull request.
  - doctype: Translation
    match: { language: ar, source_text: "Buying Price (EGP/Dozen)" }
    set: { translated_text: "سعر الشراء (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Selling Price (EGP/Nos)" }
    set: { translated_text: "سعر البيع (جنيه/قطعة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Selling Price (EGP/Dozen)" }
    set: { translated_text: "سعر البيع (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Accepted Quantity (Dozen)" }
    set: { translated_text: "الكمية المقبولة (دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Barcode (EAN-13)" }
    set: { translated_text: "الباركود (EAN-13)" }
  - doctype: Translation
    match: { language: ar, source_text: "Print the label after saving" }
    set: { translated_text: "طباعة الملصق بعد الحفظ" }
  - doctype: Translation
    match: { language: ar, source_text: "Save Item & Add" }
    set: { translated_text: "حفظ الصنف وإضافة صنف جديد" }
  - doctype: Translation
    match: { language: ar, source_text: "Add New Item" }
    set: { translated_text: "إضافة صنف جديد" }
  - doctype: Translation
    match: { language: ar, source_text: "Could not create the item" }
    set: { translated_text: "تعذّر إنشاء الصنف" }
  - doctype: Translation
    match: { language: ar, source_text: "Creating the item..." }
    set: { translated_text: "جارٍ إنشاء الصنف..." }
  - doctype: Translation
    match: { language: ar, source_text: "Creating the payment..." }
    set: { translated_text: "جارٍ إنشاء الدفعة..." }
  - doctype: Translation
    match: { language: ar, source_text: "Payment failed" }
    set: { translated_text: "فشل إنشاء الدفعة" }
  - doctype: Translation
    match: { language: ar, source_text: "Pay Invoice {0}" }
    set: { translated_text: "سداد الفاتورة {0}" }
  - doctype: Translation
    match: { language: ar, source_text: "Pay the full outstanding amount" }
    set: { translated_text: "سداد كامل المبلغ المتبقي" }
  - doctype: Translation
    match: { language: ar, source_text: "Amount to pay" }
    set: { translated_text: "المبلغ المطلوب سداده" }
  - doctype: Translation
    match: { language: ar, source_text: "Full outstanding amount" }
    set: { translated_text: "كامل المبلغ المتبقي" }
  - doctype: Translation
    match: { language: ar, source_text: "Partial payment" }
    set: { translated_text: "دفعة جزئية" }
  - doctype: Translation
    match: { language: ar, source_text: "Nothing is posted until you press Pay. The payment is then reviewed by a human, as always." }
    set: { translated_text: "لن يُرحَّل أي شيء حتى تضغط على «سداد». ثم تُراجَع الدفعة بواسطة شخص، كالعادة." }
  - doctype: Translation
    match: { language: ar, source_text: "Payment {0} submitted. Use Print for the invoice." }
    set: { translated_text: "تم ترحيل الدفعة {0}. استخدم «طباعة» للفاتورة." }
  - doctype: Translation
    match: { language: ar, source_text: "This invoice has nothing left to pay." }
    set: { translated_text: "لا يوجد مبلغ متبقٍ على هذه الفاتورة." }
  - doctype: Translation
    match: { language: ar, source_text: "Diva shortcuts" }
    set: { translated_text: "اختصارات ديفا" }
  - doctype: Translation
    match: { language: ar, source_text: "Show these shortcuts" }
    set: { translated_text: "عرض هذه الاختصارات" }
  - doctype: Translation
    match: { language: ar, source_text: "Focus customer / supplier" }
    set: { translated_text: "الانتقال إلى العميل / المورد" }
  - doctype: Translation
    match: { language: ar, source_text: "Add or focus the item row" }
    set: { translated_text: "إضافة صف صنف أو الانتقال إليه" }
  - doctype: Translation
    match: { language: ar, source_text: "Pay the Sales Invoice" }
    set: { translated_text: "سداد فاتورة المبيعات" }
  - doctype: Translation
    match: { language: ar, source_text: "Print the current document" }
    set: { translated_text: "طباعة المستند الحالي" }
  - doctype: Translation
    match: { language: ar, source_text: "Accept the first suggestion, then jump on" }
    set: { translated_text: "قبول الاقتراح الأول ثم الانتقال للتالي" }
  - doctype: Translation
    match: { language: ar, source_text: "Please allow pop-ups to print the label." }
    set: { translated_text: "يُرجى السماح بالنوافذ المنبثقة لطباعة الملصق." }
  - doctype: Translation
    match: { language: ar, source_text: "Pay" }
    set: { translated_text: "سداد" }
  - doctype: Translation
    match: { language: ar, source_text: "Print" }
    set: { translated_text: "طباعة" }

  # DEC-90: Arabic for the new Item dialog and opening-stock strings.
  - doctype: Translation
    match: { language: ar, source_text: "Create Item & Post Stock" }
    set: { translated_text: "إنشاء الصنف وترحيل المخزون" }
  - doctype: Translation
    match: { language: ar, source_text: "Wholesale Price (EGP/Dozen)" }
    set: { translated_text: "سعر الجملة (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Opening stock posts as Nos (Accepted Quantity x 12) at Buying Price / 12 per Nos." }
    set: { translated_text: "تُرحَّل الكمية الافتتاحية بالقطعة (الكمية المقبولة × 12) بسعر الشراء ÷ 12 للقطعة." }
  - doctype: Translation
    match: { language: ar, source_text: "Leave it blank to generate an internal EAN-13 (starts with 20)." }
    set: { translated_text: "اتركه فارغًا لتوليد باركود EAN-13 داخلي (يبدأ بـ 20)." }
  - doctype: Translation
    match: { language: ar, source_text: "One Dozen = 12 Nos; saved automatically." }
    set: { translated_text: "الدستة = 12 قطعة؛ تُحفظ تلقائيًا." }
  - doctype: Translation
    match: { language: ar, source_text: "Item {0} created with opening stock" }
    set: { translated_text: "تم إنشاء الصنف {0} مع المخزون الافتتاحي." }
  - doctype: Translation
    match: { language: ar, source_text: "Optional. Written to the Wholesale price list." }
    set: { translated_text: "اختياري. يُكتب في قائمة أسعار الجملة." }
  - doctype: Translation
    match: { language: ar, source_text: "Selling price per Dozen. 1 Dozen = 12 Nos; the per-Nos Standard Selling price is created automatically (rate / 12)." }
    set: { translated_text: "سعر البيع للدستة. الدستة = 12 قطعة؛ يُنشأ سعر البيع القياسي للقطعة تلقائيًا (السعر ÷ 12)." }
  - doctype: Translation
    match: { language: ar, source_text: "Scan or type a barcode; leave blank to auto-generate an internal EAN-13 (starts with 20)." }
    set: { translated_text: "امسح أو اكتب الباركود؛ واتركه فارغًا لتوليد باركود EAN-13 داخلي تلقائيًا (يبدأ بـ 20)." }
  - doctype: Translation
    match: { language: ar, source_text: "You do not have permission to post opening stock" }
    set: { translated_text: "ليس لديك صلاحية ترحيل المخزون الافتتاحي." }
  - doctype: Translation
    match: { language: ar, source_text: "Set the default company before creating items" }
    set: { translated_text: "اضبط الشركة الافتراضية قبل إنشاء الأصناف." }
  - doctype: Translation
    match: { language: ar, source_text: "Payment {0} submitted." }
    set: { translated_text: "تم ترحيل الدفعة {0}." }
