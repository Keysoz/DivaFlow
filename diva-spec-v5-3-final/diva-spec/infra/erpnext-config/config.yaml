# Configuration baseline (TASK-E-03, TASK-E-02).
# Applied through apply.py only; every change is data, never core code.

property_setters:
  # DEC-26: no VAT and no e-invoicing for this shop; hide the tax fields (E-11).
  - doctype: Sales Invoice
    fieldname: tax_id
    property: hidden
    value: 1
  - doctype: Sales Order
    fieldname: tax_id
    property: hidden
    value: 1
  - doctype: Sales Invoice
    fieldname: taxes_and_charges
    property: hidden
    value: 1
  - doctype: Sales Order
    fieldname: taxes_and_charges
    property: hidden
    value: 1
  # DEC-78/79: keep the Item quick entry at seven fields with Barcode and price.
  - doctype: Item
    fieldname: asset_category
    property: allow_in_quick_entry
    value: 0
  - doctype: Item
    fieldname: is_fixed_asset
    property: allow_in_quick_entry
    value: 0
  # DEC-80: opening stock stays in the normal Item form. DEC-88 removed it from
  # the quick entry: stock now arrives through a Purchase Receipt, not a typed
  # opening balance.
  - doctype: Item
    fieldname: opening_stock
    property: hidden
    value: 0
  - doctype: Item
    fieldname: opening_stock
    property: allow_in_quick_entry
    value: 0
  - doctype: Item
    fieldname: is_stock_item
    property: allow_in_quick_entry
    value: 0
  - doctype: Item
    fieldname: standard_rate
    property: allow_in_quick_entry
    value: 1
  - doctype: Item
    fieldname: standard_rate
    property: label
    property_type: Data
    value: Selling Price (EGP/Dozen)
  - doctype: Item
    fieldname: standard_rate
    property: description
    property_type: Text
    value: Saved to the Standard Selling price list per Dozen when the item is saved.

  # DEC-86: a Purchase Receipt lands in Stores - DD. The accepted warehouse is
  # the second field (the desk layer focuses it after the supplier) and the
  # put-away/posting-time options are noise for this shop.
  - doctype: Purchase Receipt
    fieldname: set_warehouse
    property: default
    property_type: Data
    value: Stores - DD
  - doctype: Purchase Receipt
    fieldname: apply_putaway_rule
    property: hidden
    value: 1
  - doctype: Purchase Receipt
    fieldname: set_posting_time
    property: hidden
    value: 1
  - doctype: Purchase Receipt Item
    fieldname: warehouse
    property: default
    property_type: Data
    value: Stores - DD
  # A single receiving flow: no rejects, no subcontracting, no rejection columns.
  - doctype: Purchase Receipt
    fieldname: rejected_warehouse
    property: hidden
    value: 1
  - doctype: Purchase Receipt
    fieldname: is_subcontracted
    property: hidden
    value: 1
  - doctype: Purchase Receipt Item
    fieldname: rejected_qty
    property: hidden
    value: 1
  - doctype: Purchase Receipt Item
    fieldname: rejected_warehouse
    property: hidden
    value: 1
  # DEC-87: nothing is posted on submit; the user presses Pay. Hide the
  # posting-time noise on the Sales Invoice so Customer -> Item stays the path.
  - doctype: Sales Invoice
    fieldname: set_posting_time
    property: hidden
    value: 1
  # DEC-87: the Desk Pay dialog defaults to Cash, and so does the Payment Entry.
  - doctype: Payment Entry
    fieldname: mode_of_payment
    property: default
    value: Cash

  # E-04: simplified Item form. Keep code, name, group, UOM and conversion,
  # stock/sales/purchase flags, disabled, barcodes, image, description,
  # reorder level and the cosmetics variant/batch fields; hide manufacturing,
  # serial, warranty, weight/shipping, commission, assets, tax, deferred
  # accounting and import noise (TASK-E-04, DEC-99).
  - doctype: Item
    fieldname: manufacturing
    property: hidden
    value: 1
  - doctype: Item
    fieldname: quality_tab
    property: hidden
    value: 1
  - doctype: Item
    fieldname: item_tax_section_break
    property: hidden
    value: 1
  - doctype: Item
    fieldname: deferred_accounting_section
    property: hidden
    value: 1
  - doctype: Item
    fieldname: foreign_trade_details
    property: hidden
    value: 1
  - doctype: Item
    fieldname: supplier_details
    property: hidden
    value: 1
  - doctype: Item
    fieldname: auto_create_assets
    property: hidden
    value: 1
  - doctype: Item
    fieldname: is_grouped_asset
    property: hidden
    value: 1
  - doctype: Item
    fieldname: asset_category
    property: hidden
    value: 1
  - doctype: Item
    fieldname: asset_naming_series
    property: hidden
    value: 1
  - doctype: Item
    fieldname: is_fixed_asset
    property: hidden
    value: 1
  - doctype: Item
    fieldname: allow_alternative_item
    property: hidden
    value: 1
  - doctype: Item
    fieldname: is_customer_provided_item
    property: hidden
    value: 1
  - doctype: Item
    fieldname: over_delivery_receipt_allowance
    property: hidden
    value: 1
  - doctype: Item
    fieldname: over_billing_allowance
    property: hidden
    value: 1
  - doctype: Item
    fieldname: end_of_life
    property: hidden
    value: 1
  - doctype: Item
    fieldname: default_material_request_type
    property: hidden
    value: 1
  - doctype: Item
    fieldname: warranty_period
    property: hidden
    value: 1
  - doctype: Item
    fieldname: weight_per_unit
    property: hidden
    value: 1
  - doctype: Item
    fieldname: weight_uom
    property: hidden
    value: 1
  - doctype: Item
    fieldname: allow_negative_stock
    property: hidden
    value: 1
  - doctype: Item
    fieldname: has_serial_no
    property: hidden
    value: 1
  - doctype: Item
    fieldname: serial_no_series
    property: hidden
    value: 1
  - doctype: Item
    fieldname: use_serial_no_wise_valuation
    property: hidden
    value: 1
  - doctype: Item
    fieldname: retain_sample
    property: hidden
    value: 1
  - doctype: Item
    fieldname: sample_quantity
    property: hidden
    value: 1
  - doctype: Item
    fieldname: enable_deferred_expense
    property: hidden
    value: 1
  - doctype: Item
    fieldname: no_of_months_exp
    property: hidden
    value: 1
  - doctype: Item
    fieldname: enable_deferred_revenue
    property: hidden
    value: 1
  - doctype: Item
    fieldname: no_of_months
    property: hidden
    value: 1
  - doctype: Item
    fieldname: grant_commission
    property: hidden
    value: 1
  - doctype: Item
    fieldname: delivered_by_supplier
    property: hidden
    value: 1
  - doctype: Item
    fieldname: country_of_origin
    property: hidden
    value: 1
  - doctype: Item
    fieldname: customs_tariff_number
    property: hidden
    value: 1

workspaces:
  # E-02: hide HR, payroll and manufacturing workspaces (DEC-24).
  # HR and Payroll are currently absent on the dev site and are reported as "missing".
  - name: HR
    hidden: true
  - name: Payroll
    hidden: true
  - name: Manufacturing
    hidden: true
  # ENH-E-02: keep the Desk focused on the shop; these modules are unused.
  - name: Assets
    hidden: true
  - name: Quality
    hidden: true
  - name: Projects
    hidden: true
  - name: Support
    hidden: true
  - name: Website
    hidden: true
  - name: CRM
    hidden: true
  - name: Build
    hidden: true

singles:
  # Global defaults: the company is required by reports opened from dashboards
  # without explicit filters (e.g. Item-wise Sales History).
  - doctype: Global Defaults
    field: default_company
    value: Diva Dev
  # E-04: negative stock off; reservations on (RULE-STOCK / DEC-08).
  - doctype: Stock Settings
    field: allow_negative_stock
    value: 0
  - doctype: Stock Settings
    field: enable_stock_reservation
    value: 1
  - doctype: Stock Settings
    field: auto_reserve_stock
    value: 1
  # E-14c: FEFO for batch items and auto bundles at the counter.
  - doctype: Stock Settings
    field: pick_serial_and_batch_based_on
    value: Expiry
  - doctype: Stock Settings
    field: enable_serial_and_batch_no_for_item
    value: 1
  - doctype: Stock Settings
    field: auto_create_serial_and_batch_bundle_for_outward
    value: 1

# DEC-78: one governed custom field so the Item quick entry can take a barcode.
# diva_guard copies it into the Item Barcode child table on save.
custom_fields:
  - dt: Item
    fieldname: custom_barcode
    label: Barcode
    fieldtype: Data
    insert_after: item_name
    allow_in_quick_entry: 1
    no_copy: 1
    description: Scan or type a barcode; it is added to the Barcodes table when you save.

# E-16 / DEC-72: POS Next ships Custom DocPerm rows. Frappe ignores the
# standard DocPerm table for any doctype that has custom rows, so roles without
# a custom row lose access. Mirror the standard rows back (existing custom rows,
# including the vendor's POSNext Cashier, are left untouched).
permission_mirrors:
  - Account
  - Address
  - Bin
  - Customer
  - Item
  - Journal Entry
  - POS Closing Entry
  - POS Opening Entry
  - POS Profile
  - Payment Entry
  - Promotional Scheme
  - Sales Invoice
  - Serial and Batch Bundle
  - Territory
  - Warehouse

# E-15: bilingual (Arabic primary, English second line) print formats. The HTML
# templates live in infra/erpnext-config/print_formats and are applied as data.
print_formats:
  - name: Diva Sales Invoice A4
    doc_type: Sales Invoice
    template: print_formats/diva_sales_invoice_a4.html
  - name: Diva Receipt 80mm
    doc_type: Sales Invoice
    template: print_formats/diva_receipt_80mm.html
  - name: Diva Payment Receipt
    doc_type: Payment Entry
    template: print_formats/diva_payment_receipt.html
  - name: Diva Purchase Invoice A4
    doc_type: Purchase Invoice
    template: print_formats/diva_purchase_invoice_a4.html
  - name: Diva Purchase Receipt A4
    doc_type: Purchase Receipt
    template: print_formats/diva_purchase_receipt_a4.html
  - name: Diva Journal Entry A4
    doc_type: Journal Entry
    template: print_formats/diva_journal_entry_a4.html
  - name: Diva Customer Statement
    doc_type: Customer
    template: print_formats/diva_customer_statement.html
  - name: Diva Supplier Statement
    doc_type: Supplier
    template: print_formats/diva_supplier_statement.html

records:
  # E-04: the Dozen UOM is a whole number (DEC-20); item group tree default (OPEN-13).
  - doctype: UOM
    match: { uom_name: Dozen }
    set: { must_be_whole_number: 1, enabled: 1 }
  - doctype: Item Group
    match: { item_group_name: Accessories }
    set: { is_group: 0, parent_item_group: All Item Groups }
  - doctype: Item Group
    match: { item_group_name: Cosmetics }
    set: { is_group: 0, parent_item_group: All Item Groups }
  # E-05: one extra selling tier (OPEN-03 default: standard plus one tier).
  - doctype: Price List
    match: { price_list_name: Wholesale }
    set: { selling: 1, currency: EGP, enabled: 1 }
  # Arabic for the one new quick-entry label/description (DEC-79).
  - doctype: Translation
    match: { language: ar, source_text: "Selling Price (EGP/Dozen)" }
    set: { translated_text: "سعر البيع (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Saved to the Standard Selling price list per Dozen when the item is saved." }
    set: { translated_text: "يُحفظ في قائمة أسعار البيع القياسية لكل دستة عند حفظ الصنف." }

  # DEC-85/DEC-87: Arabic for the new Desk strings. Native review is requested in the pull request.
  - doctype: Translation
    match: { language: ar, source_text: "Buying Price (EGP/Dozen)" }
    set: { translated_text: "سعر الشراء (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Selling Price (EGP/Nos)" }
    set: { translated_text: "سعر البيع (جنيه/قطعة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Selling Price (EGP/Dozen)" }
    set: { translated_text: "سعر البيع (جنيه/دستة)" }
  - doctype: Translation
    match: { language: ar, source_text: "Accepted Quantity (Dozen)" }
    set: { translated_text: "الكمية المقبولة (دستة)" }
  - doctype: Translation
