  - doctype: Translation
    match: { language: ar, source_text: "Payment failed" }
    set: { translated_text: "فشل إنشاء الدفعة" }
  - doctype: Translation
    match: { language: ar, source_text: "Pay Invoice {0}" }
    set: { translated_text: "سداد الفاتورة {0}" }
  - doctype: Translation
    match: { language: ar, source_text: "Pay the full outstanding amount" }
    set: { translated_text: "سداد كامل المبلغ المتبقي" }
  - doctype: Translation
    match: { language: ar, source_text: "Amount to pay" }
    set: { translated_text: "المبلغ المطلوب سداده" }
  - doctype: Translation
    match: { language: ar, source_text: "Full outstanding amount" }
    set: { translated_text: "كامل المبلغ المتبقي" }
  - doctype: Translation
    match: { language: ar, source_text: "Partial payment" }
    set: { translated_text: "دفعة جزئية" }
  - doctype: Translation
    match: { language: ar, source_text: "Nothing is posted until you press Pay. The payment is then reviewed by a human, as always." }
    set: { translated_text: "لن يُرحَّل أي شيء حتى تضغط على «سداد». ثم تُراجَع الدفعة بواسطة شخص، كالعادة." }
  - doctype: Translation
    match: { language: ar, source_text: "Payment {0} submitted. Use Print for the invoice." }
    set: { translated_text: "تم ترحيل الدفعة {0}. استخدم «طباعة» للفاتورة." }
  - doctype: Translation
    match: { language: ar, source_text: "This invoice has nothing left to pay." }
    set: { translated_text: "لا يوجد مبلغ متبقٍ على هذه الفاتورة." }
  - doctype: Translation
    match: { language: ar, source_text: "Diva shortcuts" }
    set: { translated_text: "اختصارات ديفا" }
  - doctype: Translation
    match: { language: ar, source_text: "Show these shortcuts" }
    set: { translated_text: "عرض هذه الاختصارات" }
  - doctype: Translation
    match: { language: ar, source_text: "Focus customer / supplier" }
    set: { translated_text: "الانتقال إلى العميل / المورد" }
  - doctype: Translation
    match: { language: ar, source_text: "Add or focus the item row" }
    set: { translated_text: "إضافة صف صنف أو الانتقال إليه" }
  - doctype: Translation
    match: { language: ar, source_text: "Pay the Sales Invoice" }
    set: { translated_text: "سداد فاتورة المبيعات" }
  - doctype: Translation
    match: { language: ar, source_text: "Print the current document" }
    set: { translated_text: "طباعة المستند الحالي" }
  - doctype: Translation
    match: { language: ar, source_text: "Accept the first suggestion, then jump on" }
    set: { translated_text: "قبول الاقتراح الأول ثم الانتقال للتالي" }
  - doctype: Translation
    match: { language: ar, source_text: "Please allow pop-ups to print the label." }
    set: { translated_text: "يُرجى السماح بالنوافذ المنبثقة لطباعة الملصق." }
  - doctype: Translation
    match: { language: ar, source_text: "Pay" }
    set: { translated_text: "سداد" }
  - doctype: Translation
    match: { language: ar, source_text: "Print" }
    set: { translated_text: "طباعة" }

  # Glossary alignment: Item = صنف, Warehouse = مخزن (docs/19 section 8).
  - doctype: Translation
    match: { language: ar, source_text: "Item Code" }
    set: { translated_text: "رمز الصنف" }
  - doctype: Translation
    match: { language: ar, source_text: "Item Name" }
    set: { translated_text: "اسم الصنف" }
  - doctype: Translation
    match: { language: ar, source_text: "Accepted Warehouse" }
    set: { translated_text: "المخزن المستلم" }
  - doctype: Translation
    match: { language: ar, source_text: "Opening stock" }
    set: { translated_text: "المخزون الافتتاحي" }

  # UOM change guard: ERPNext's ar.po mistranslates 'Default UOM' as 'default user interface' and appends the English line; replace it with clean Arabic.
  - doctype: Translation
    match: { language: ar, source_text: "Default Unit of Measure for Item {0} cannot be changed directly because you have already made some transaction(s) with another UOM. You will need to create a new Item to use a different Default UOM." }
    set: { translated_text: "لا يمكن تغيير وحدة القياس الافتراضية للصنف {0} مباشرةً بعد إجراء معاملات بوحدة قياس أخرى. أنشئ صنفًا جديدًا لاستخدام وحدة قياس افتراضية مختلفة." }
  - doctype: Translation
    match: { language: ar, source_text: "Default Unit of Measure for Item {0} cannot be changed directly because you have already made some transaction(s) with another UOM. You need to either cancel the linked documents or create a new Item." }
    set: { translated_text: "لا يمكن تغيير وحدة القياس الافتراضية للصنف {0} مباشرةً بعد إجراء معاملات بوحدة قياس أخرى. يجب إلغاء المستندات المرتبطة أو إنشاء صنف جديد." }
  # E-15: print EGP explicitly instead of ERPNext's ambiguous "£ or ج.م" symbol.
  - doctype: Currency
    match: { name: EGP }
    set: { symbol: EGP }
