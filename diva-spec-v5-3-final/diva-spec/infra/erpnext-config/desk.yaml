  - - Sales Invoice
    - docstatus
    - '='
    - 1
  - - Sales Invoice
    - is_return
    - '='
    - 0
  - - Sales Invoice
    - posting_date
    - Timespan
    - this month
  show_percentage_stats: 1
  stats_time_interval: Monthly
  is_public: 1
  is_standard: 0
  module: Custom Reports
  color: '#2b8a3e'
  background_color: '#ebfbee'
  currency: EGP
- name: Diva Receivables
