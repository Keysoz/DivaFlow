# Diva Desk layout (ENH-E-02).
# Applied through infra/erpnext-config/apply_desk.py; everything is data
# (Workspace, Dashboard Chart, Number Card), never core code.
#
# Charts are deliberately few and readable: one trend, one mix, one ranking
# per area. Colors follow the Diva palette (green = sales, blue = stock,
# orange = purchasing, red = money owed).
dashboard_charts:
- name: Diva Sales Trend
  chart_name: Diva Sales Trend
  chart_type: Sum
  document_type: Sales Invoice
  based_on: posting_date
  value_based_on: base_grand_total
  timespan: Last Year
  time_interval: Monthly
  type: Line
  color: '#2f9e44'
  show_values_over_chart: 1
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
  - - Sales Invoice
    - docstatus
    - '='
    - 1
  - - Sales Invoice
    - is_return
    - '='
    - 0
  currency: EGP
- name: Diva Sales by Item Group
  chart_name: Diva Sales by Item Group
  chart_type: Group By
  document_type: Sales Invoice Item
  parent_document_type: Sales Invoice
  group_by_type: Sum
  group_by_based_on: item_group
  aggregate_function_based_on: amount
  number_of_groups: 3
  type: Donut
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
  - - Sales Invoice
    - docstatus
    - '='
    - 1
  - - Sales Invoice
    - is_return
    - '='
    - 0
  currency: EGP
- name: Diva Sales by Warehouse
  chart_name: Diva Sales by Warehouse
  chart_type: Group By
  document_type: Sales Invoice Item
  parent_document_type: Sales Invoice
  group_by_type: Sum
  group_by_based_on: warehouse
  aggregate_function_based_on: amount
  number_of_groups: 4
  type: Bar
  color: '#1971c2'
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
  - - Sales Invoice
    - docstatus
    - '='
    - 1
  - - Sales Invoice
    - is_return
    - '='
    - 0
  currency: EGP
- name: Diva Payments by Mode
  chart_name: Diva Payments by Mode
  chart_type: Group By
  document_type: Payment Entry
  group_by_type: Sum
  group_by_based_on: mode_of_payment
  aggregate_function_based_on: base_paid_amount
  number_of_groups: 8
  type: Donut
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
  - - Payment Entry
    - docstatus
    - '='
    - 1
  - - Payment Entry
    - payment_type
    - '='
    - Receive
  - - Payment Entry
    - mode_of_payment
    - is
    - set
  currency: EGP
- name: Diva Top Customers
  chart_name: Diva Top Customers
  chart_type: Group By
  document_type: Sales Invoice
  group_by_type: Sum
  group_by_based_on: customer
  aggregate_function_based_on: base_grand_total
  number_of_groups: 3
  type: Donut
  color: '#7048e8'
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
  - - Sales Invoice
    - docstatus
    - '='
    - 1
  - - Sales Invoice
    - is_return
    - '='
    - 0
  currency: EGP
- name: Diva Top Suppliers
  chart_name: Diva Top Suppliers
  chart_type: Group By
  document_type: Purchase Invoice
  group_by_type: Sum
  group_by_based_on: supplier
  aggregate_function_based_on: base_grand_total
  number_of_groups: 2
  type: Donut
  color: '#e8590c'
  is_public: 1
  is_standard: 0
  module: Custom Reports
  currency: EGP
  filters_json:
  - - Purchase Invoice
    - docstatus
    - '='
    - 1
  - - Purchase Invoice
    - is_return
    - '='
    - 0
- name: Diva Receivables Ageing
  chart_name: Diva Receivables Ageing
  chart_type: Report
  report_name: Accounts Receivable
  use_report_chart: 1
  type: Donut
  currency: EGP
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
    ageing_based_on: Due Date
    range1: 30
    range2: 60
    range3: 90
    range4: 120
    group_by_party: 0
    based_on_payment_terms: 0
    show_future_payments: 0
    show_delivery_notes: 0
    show_sales_person: 0
- name: Diva Payables Ageing
  chart_name: Diva Payables Ageing
  chart_type: Report
  report_name: Accounts Payable
  use_report_chart: 1
  type: Donut
  currency: EGP
  is_public: 1
  is_standard: 0
  module: Custom Reports
  filters_json:
    ageing_based_on: Due Date
    range1: 30
    range2: 60
    range3: 90
    range4: 120
    group_by_party: 0
    based_on_payment_terms: 0
    show_future_payments: 0
    show_delivery_notes: 0
    show_sales_person: 0
- name: Diva Overrides by Status
  chart_name: Diva Overrides by Status
  chart_type: Group By
  document_type: Diva Override Approval
  group_by_type: Count
  group_by_based_on: status
  number_of_groups: 3
  type: Donut
  is_public: 1
  is_standard: 0
  module: Diva Guard
  filters_json: []
  currency: ''
number_cards:
- name: Diva Today Sales
  label: Today's Sales
  type: Document Type
  document_type: Sales Invoice
  function: Sum
  aggregate_function_based_on: base_grand_total
