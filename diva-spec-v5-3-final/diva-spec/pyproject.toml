[tool.uv.workspace]
members = ["packages/rules-engine", "apps/cloud-api", "apps/local-api"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/rules-engine/src", "apps/cloud-api/src", "apps/local-api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/rules-engine/src", "apps/cloud-api/src", "apps/local-api/src"]
mypy_path = ["packages/rules-engine/src", "apps/cloud-api/src", "apps/local-api/src"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = "-q --import-mode=importlib"
markers = [
  "e2e: end-to-end tests (Playwright), added with the first UI task",
  "contract: adapter contract tests, added with TASK-E-12",
]
