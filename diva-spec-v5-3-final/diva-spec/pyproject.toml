[tool.uv.workspace]
members = ["packages/rules-engine", "packages/erpnext-adapter", "apps/cloud-api", "apps/local-api"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/rules-engine/src", "packages/erpnext-adapter/src", "apps/cloud-api/src", "apps/local-api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/rules-engine/src", "packages/erpnext-adapter/src", "apps/cloud-api/src", "apps/local-api/src", "infra/erpnext-config", "scripts"]
mypy_path = ["packages/rules-engine/src", "packages/erpnext-adapter/src", "apps/cloud-api/src", "apps/local-api/src", "infra/erpnext-config"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["infra/erpnext-config"]
markers = [
  "e2e: end-to-end tests (Playwright), added with the first UI task",
  "contract: adapter contract tests, added with TASK-E-12",
]
